name: PhotoCompress
options:
  bundleIdPrefix: com.liliannesperry
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # set your Team ID (or pick it in Xcode > Signing & Capabilities)
targets:
  PhotoCompress:
    type: application
    platform: iOS
    sources:
      - path: PhotoCompress
        excludes: ["**/.gitkeep"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liliannesperry.photocompress
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Photo Compress
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
